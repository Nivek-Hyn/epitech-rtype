name: Bug
description: Un comportement incorrect à corriger
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Lancer ./r-type_server
        2. ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Plateforme
      placeholder: Linux (Fedora 43), Windows 11...
