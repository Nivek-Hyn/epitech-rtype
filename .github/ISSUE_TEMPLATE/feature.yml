name: Tâche / fonctionnalité
description: Une tâche à réaliser (code, documentation, infra...)
labels: []
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domaine
      options:
        - engine
        - network
        - client
        - gameplay
        - docs
        - infra
        - accessibility
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objectif
      description: Ce qui doit exister ou fonctionner une fois la tâche terminée.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Critères de fin
      description: Comment vérifier que c'est terminé (tests, comportement visible...).
      placeholder: |
        - [ ] ...
