name: CI

# Run by hand only (Actions tab > CI > Run workflow): automatic runs failed on every push while the
# Actions budget was exhausted and notified the whole team. Run scripts/check.sh locally before pushing.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libudev-dev

      # Downloaded dependency sources: only refreshed when the dependency list changes.
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      # Build folder: avoids recompiling SFML and GoogleTest on every push.
      - uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same clang-format version as the team (pip install clang-format==23.1.3), formatting differs between versions.
      - name: Check formatting
        run: |
          pip install clang-format==23.1.3
          find engine common server client tests \( -name '*.cpp' -o -name '*.hpp' \) | xargs clang-format --dry-run --Werror
